# Netlify hosting for the web app. Production deploys cost credits (15 each
# on the free plan's 300 a month), so scripts/netlify-ignore.sh skips builds
# for changes that can't affect the web app, and, with WEB_DEPLOY_MODE=batched
# set in Netlify, leaves publishing to the "Publish web app" GitHub workflow.
[build]
  command = "npx expo export --platform web"
  publish = "dist"
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

# Recipe import for the web app: fetches recipe pages server side, since
# browsers can't read other sites' pages. Served at /.netlify/functions/import-recipe.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Single page app: every route serves index.html. Real files such as the
# PowerSync workers in /@powersync are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
