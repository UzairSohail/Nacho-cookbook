# Builds an installable Android test APK.
# Pull requests only check that the APK builds. Each merge to master (or a
# manual run) publishes it as the one "Test build N" release and deletes the
# older ones, so this link always downloads the newest APK:
# https://github.com/UzairSohail/Nacho-cookbook/releases/latest/download/nacho-cookbook.apk
# The app reads the latest release (tag test-build-N, version code N) to offer
# in-app updates, so keep the tag format and the APK file name as they are.
name: Android test APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Generates the native Android project from app.json (android/ isn't committed).
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # Each build gets a higher version code so it installs over the last one.
      - run: sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle

      # Release build signed with the template's debug key: fine for testing,
      # not for the Play Store. 64-bit ARM only, which covers current phones
      # and keeps the build fast.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Name the APK
        if: github.event_name != 'pull_request'
        run: cp android/app/build/outputs/apk/release/app-release.apk nacho-cookbook.apk

      # A release rather than a workflow artifact: artifacts count toward the
      # account's Actions storage quota and download as a zip. Marked as the
      # latest release so /releases/latest/download/nacho-cookbook.apk works.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Test build ${{ github.run_number }}
          make_latest: true
          body: |
            Android test build from ${{ github.sha }}.
            Download nacho-cookbook.apk below on your Android phone and open it to install (allow installs from your browser if asked).
          files: nacho-cookbook.apk

      # Keep only this build: delete every other test build release and its tag.
      - name: Delete older test builds
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: test-build-${{ github.run_number }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | grep '^test-build-' | grep -vx "$CURRENT" \
            | while read -r tag; do
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
