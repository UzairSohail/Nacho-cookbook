# Publishes the web app (https://nachocookbook.netlify.app) on demand.
# Each Netlify production deploy costs 15 of the free plan's 300 monthly
# credits, so with batched publishing on (Netlify variable
# WEB_DEPLOY_MODE=batched) merges no longer publish one by one. Instead:
#   - Actions > Publish web app > Run workflow publishes master now.
#   - Every Monday morning (Sydney) it publishes, if web files changed.
# Needs the repository secret NETLIFY_BUILD_HOOK (a Netlify build hook URL).
name: Publish web app

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0" # Monday 5am AEDT / 4am AEST

permissions:
  contents: write

concurrency:
  group: publish-web
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Check for web changes since the last publish
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(git rev-parse -q --verify "refs/tags/web-published^{commit}" || true)
          if CONTEXT=check CACHED_COMMIT_REF="$last" COMMIT_REF=HEAD bash scripts/netlify-ignore.sh; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the Netlify build hook
        if: steps.check.outputs.publish == 'true'
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Add the NETLIFY_BUILD_HOOK repository secret first (see README)."; exit 1
          fi
          curl -fsS -X POST -d '{}' "$HOOK?trigger_title=Publish+web+app"

      - name: Remember what was published
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag -f web-published HEAD
          git push -f origin refs/tags/web-published
