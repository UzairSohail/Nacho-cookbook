# Deploys the web app's recipe import helper (the Supabase Edge Function
# "import-recipe", built from src/import/importHandler.ts) whenever the import
# code changes on master, and from Actions > Deploy import helper > Run workflow.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (a Supabase personal access
# token: supabase.com/dashboard/account/tokens). See README.
name: Deploy import helper

on:
  push:
    branches: [master]
    paths:
      - "src/core/**"
      - "src/import/**"
      - "scripts/build-import-function.mjs"
      - "package-lock.json"
      - ".github/workflows/import-function.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:import-function

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first (see README)."; exit 1
          fi
          supabase functions deploy import-recipe --remote=jxquqfsloyzgvtwaktzy --use-api --yes
